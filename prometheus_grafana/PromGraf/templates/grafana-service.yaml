apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert --chart
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  type: LoadBalancer
  externalIPs: [ {{ .Values.EXTERNAL_IP }} ]
  ports:
    - port: {{ .Values.EXTERNAL_PORT }}
      targetPort: 3000
  selector:
    io.kompose.service: grafana
